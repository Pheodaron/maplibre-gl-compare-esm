<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/dist/maplibre-gl-compare.css">
  <style>
    body { margin: 0; }
    #wrapper { position: relative; width: 800px; height: 400px; }
    #a, #b { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="wrapper"><div id="a"></div><div id="b"></div></div>
  <script type="module">
    import { Map } from '/maplibre/maplibre-gl.mjs';
    import Compare from '/dist/maplibre-gl-compare.js';

    const style = color => ({
      version: 8,
      sources: {
        shape: { type: 'geojson', data: {
          type: 'Feature', properties: {}, geometry: {
            type: 'Polygon', coordinates: [[[-2,-2],[2,-2],[2,2],[-2,2],[-2,-2]]]
          }
        }}
      },
      layers: [
        { id: 'background', type: 'background', paint: { 'background-color': color } },
        { id: 'shape', type: 'fill', source: 'shape', paint: { 'fill-color': color } }
      ]
    });
    const errors = [];
    const a = new Map({ container: 'a', style: style('#ff0000'), center: [0,0], zoom: 2, attributionControl: false });
    const b = new Map({ container: 'b', style: style('#0000ff'), center: [10,20], zoom: 4, attributionControl: false });
    for (const map of [a,b]) map.on('error', e => errors.push(e.error.message));
    await Promise.all([a,b].map(map => new Promise(resolve => map.on('load', resolve))));
    window.fixture = { a, b, errors, Compare, compare: new Compare(a,b,'#wrapper'), slideEnds: [] };
    fixture.compare.on('slideend', e => fixture.slideEnds.push(e.currentPosition));
  </script>
</body>
</html>
