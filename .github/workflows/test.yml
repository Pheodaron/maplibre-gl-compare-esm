name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        maplibre: ['6.0.0', '6.8.0', '6.16.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false maplibre-gl@${{ matrix.maplibre }}
      - run: npx playwright install --with-deps chromium
      - run: npm test
